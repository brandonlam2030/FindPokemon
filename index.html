<!doctype html>
<html>
  <head>
    <title>Poke Wiki</title>
    <meta name="description" content="A Pokemon Catalogue Website" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/Favicon.png" />
  </head>

  <body>
    <header class="main-header">
      <nav class = "navbar">
        <div class="heading">
          <img src = "assets/page-logo.png" style = "height:200%;">
          <h1>ᴡɪᴋɪ</h1>
        </div>
        <div class="contact">
          <a target = "_blank" href = "https://github.com/brandonlam2030/FindPokemon"><img src = "assets/github_logo.png" style="height: 50px; width:50px;"></a>
        </div>
      </nav>
    </header>
    <div class = "filter">
      <input type = "text" class = "search-box" id = "search-bar" placeholder = "Search" autocomplete = "off">
      <button class = "hover-button"><img src = "assets/filter-solid.png" style = "height:100%; width:30%; background:transparent"/>Filters</button>
      <div class="filter-options">
        <div class="upper">
          <div class="generation">
            <h2>Generation</h2>
            <hr>
            <ul>
              <li><button class="chip" data-name="generation" data-value="1">Generation 1</button></li>
              <li><button class="chip" data-name="generation" data-value="2">Generation 2</button></li>
              <li><button class="chip" data-name="generation" data-value="3">Generation 3</button></li>
              <li><button class="chip" data-name="generation" data-value="4">Generation 4</button></li>
              <li><button class="chip" data-name="generation" data-value="5">Generation 5</button></li>
              <li><button class="chip" data-name="generation" data-value="6">Generation 6</button></li>
              <li><button class="chip" data-name="generation" data-value="7">Generation 7</button></li>
            </ul>
          </div>
          <div class="elements">
            <h2>Type</h2>
            <hr>
            <div class="wrapper">
              <ul>
                <li><button class="chip normal" data-name="type" data-value="normal">normal</button></li>
                <li><button class="chip fire" data-name="type" data-value="fire">fire</button></li>
                <li><button class="chip water" data-name="type" data-value="water">water</button></li>
                <li><button class="chip grass" data-name="type" data-value="grass">grass</button></li>
                <li><button class="chip electric" data-name="type" data-value="electric">electric</button></li>
                <li><button class="chip ice" data-name="type" data-value="ice">ice</button></li>
                <li><button class="chip fighting" data-name="type" data-value="fighting">fighting</button></li>
                <li><button class="chip poison" data-name="type" data-value="poison">poison</button></li>
                <li><button class="chip ground" data-name="type" data-value="ground">ground</button></li>
                <li><button class="chip flying" data-name="type" data-value="flying">flying</button></li>
              </ul>
              <ul>
                <li><button class="chip psychic" data-name="type" data-value="psychic">psychic</button></li>
                <li><button class="chip bug" data-name="type" data-value="bug">bug</button></li>
                <li><button class="chip rock" data-name="type" data-value="rock">rock</button></li>
                <li><button class="chip dragon" data-name="type" data-value="dragon">dragon</button></li>
                <li><button class="chip ghost" data-name="type" data-value="ghost">ghost</button></li>
                <li><button class="chip dark" data-name="type" data-value="dark">dark</button></li>
                <li><button class="chip steel" data-name="type" data-value="steel">steel</button></li>
                <li><button class="chip fairy" data-name="type" data-value="fairy">fairy</button></li>
              </ul>
            </div>
          </div>
          <div class="misc">
            <h2>Misc</h2>
            <hr>
            <ul>
              <li><button class="chip is_legendary" data-name="is_legendary" data-value="1">Legendary</button></li>
            </ul>
          </div>
        </div>
        <div class="lower">
          <h3 id = "filter-count">Filters</h3>
          <button id = "clear" onclick = "clearFilters()">Clear Filters</button>
        </div>
      </div>
    </div>
    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <h2></h2>
        <img src="" alt="TV Show Poster">
        <div class = "type">
          <div class="type1">
            <h2></h2>
          </div>
          <div class="type2">
            <h2></h2>
          </div>
        </div>
        <div class="stats">
          <div class="stat-box">
            <h2>ATK</h2>
            <div class = "atk"></div>
          </div>
          <div class="stat-box">
            <h2>DEF</h2>
            <div class = "def"></div>
          </div>
          <div class="stat-box">
            <h2>Sp.ATK</h2>
            <div class = "spatk"></div>
          </div>
          <div class="stat-box">
            <h2>Sp.DEF</h2>
            <div class = "spdef"></div>
          </div>
          <div class="stat-box">
            <h2>SPD</h2>
            <div class = "spd"></div>
          </div>
        </div>
        <div class="shop">
          <a target = "_blank" href = "https://www.tcgplayer.com/search/all/product?q=bulbasaur+&view=grid">Buy a card</a>
        </div>
      </div>
    </div>
    <button onclick = "filter()" class = "load"><p>Load More</p></button>
    <script type="text/javascript" src="scripts.js"></script>
  </body>
</html>
