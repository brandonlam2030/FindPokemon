<!doctype html>
<html>
  <head>
    <title>Shop Pokemon</title>
    <meta name="description" content="A Pokemon E-Commerce Website" />
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="scripts.js"></script>
    <link rel="icon" type="image/png" href="assets/Favicon.png" />
  </head>

  <body>
    <header class="main-header">
      <nav class = "navbar">
        <p>Home</p>
        <p>Placeholder 1</p>
        <p>Placeholder 2</p>
      </nav>
    </header>
    <div class = "filter">
      <input type = "text" class = "search-box" placeholder = "Search">
      <button>Search</button>
      <button><img src = "assets/filter-solid.png" style = "height:100%; width:30%; background:transparent"/>Filters</button>
    </div>
    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <h2>TV Show Title</h2>
        <img src="" alt="TV Show Poster" />
      </div>
    </div>
    <button onclick = showCards() class = "load"><p>Load More</p></button>
  </body>
</html>
